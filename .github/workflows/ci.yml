name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The agent and gate packages drive real nftables, so their tests only
      # pass with root, CAP_NET_ADMIN, and nft(8) present. scripts/linux-test.sh
      # supplies all three in a privileged, network-isolated container and runs
      # the whole module serially (-p 1) so the fixed-name tables cannot clash.
      # A bare `go test ./...` on the runner has none of that and cannot pass.
      - run: ./scripts/linux-test.sh ./... -race
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # gosec (enabled in .golangci.yml) is the only automated security
      # control in this repo, so it needs to run on every push rather than
      # rely on a contributor remembering `make lint` locally.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Short run on every push; the corpus does the heavy lifting.
      - run: go test ./internal/spa/ -run=Fuzz -fuzz=FuzzParse -fuzztime=60s
